services:
  ssl-vice:
    build: .
    container_name: ssl-vice
    network_mode: "host"
    volumes:
    - ./src:/root/ssl-VICE/src
    - ./install:/root/ssl-VICE/install
    environment:
      - ARARA_VICE_PATH=/root/ssl-VICE
    command: ["bash", "/root/ssl-VICE/entrypoint.sh"]

  ssl-gui:
    build:
      context: ../ssl-gui
    container_name: ssl-gui
    network_mode: "host"
    volumes:
      # Must match the image's WORKDIR (/app): vite runs from there, so mounting the
      # source anywhere else leaves it serving the snapshot baked in at build time.
      - ../ssl-gui:/app
      # Keeps the image's node_modules instead of letting the host's shadow it.
      - /app/node_modules
    stdin_open: true
    tty: true
